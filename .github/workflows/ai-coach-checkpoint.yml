name: AI Coach checkpoint checks
on:
  push:
    branches: [ai-coach-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/lms
      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: 4515014c87ece6cb20ee91d2cfb121c5cbd1ff4a
          path: apps/frappe
          sparse-checkout: ui
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare pinned native frontend and bridge
        run: |
          mkdir -p sites
          echo '{"socketio_port":9000}' > sites/common_site_config.json
          python apps/lms/deploy/apply_bridge.py
      - name: Install native dependencies
        working-directory: apps/lms
        run: yarn install --frozen-lockfile
      - name: Test native frontend
        working-directory: apps/lms/frontend
        run: yarn test
      - name: Build patched native frontend
        working-directory: apps/lms
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build
  rules-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install standalone rules-test dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Compile custom Python sources
        run: python -m compileall -q apps/bpo_coach/bpo_coach deploy
      - name: Verify pilot scoring parity and rules
        env:
          PYTHONPATH: apps/bpo_coach
        run: python -m unittest discover -s apps/bpo_coach/tests -v
      - name: Verify bridge patch, asset export and bootstrap recovery
        run: python -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Install custom frontend dependencies
        working-directory: apps/bpo_coach/frontend
        run: npm ci
      - name: Build custom Vue frontend
        working-directory: apps/bpo_coach/frontend
        run: npm run build
      - name: Test custom frontend and native EditorJS bridge
        working-directory: apps/bpo_coach/frontend
        run: npm test
