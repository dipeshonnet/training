map $http_x_forwarded_proto $forwarded_scheme { default $http_x_forwarded_proto; '' $scheme; }
map $http_origin $socket_origin { default $http_origin; '' $forwarded_scheme://$http_host; }
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;
upstream frappe { zone frappe_backend 64k; server backend:8000 resolve; }
upstream socketio { zone frappe_socketio 64k; server websocket:9000 resolve; }
server {
  listen 8080;
  server_name _;
  client_max_body_size 25m;
  root /home/frappe/frappe-bench/sites;
  location /assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1h;
  }
  location /files/ {
    try_files /$host/public$uri =404;
    add_header X-Content-Type-Options nosniff always;
    # Public uploaded documents must not execute in the application's origin.
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
  }
  location ~ ^/protected/(.*) {
    internal;
    try_files /$host/$1 =404;
    add_header Cache-Control "private, no-store" always;
  }
  location /socket.io {
    proxy_pass http://socketio;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Frappe-Site-Name $host;
    proxy_set_header Origin $socket_origin;
  }
  location / {
    proxy_pass http://frappe;
    proxy_set_header Host $host;
    proxy_set_header X-Frappe-Site-Name $host;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Use-X-Accel-Redirect True;
    proxy_read_timeout 120s;
    add_header Cache-Control "private, no-store" always;
    add_header Permissions-Policy "microphone=(self)" always;
  }
}
