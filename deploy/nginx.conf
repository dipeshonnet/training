map $http_x_forwarded_proto $forwarded_scheme { default $http_x_forwarded_proto; '' $scheme; }
upstream frappe { server backend:8000; }
upstream socketio { server websocket:9000; }
server {
  listen 8080;
  server_name _;
  client_max_body_size 25m;
  root /home/frappe/frappe-bench/sites;
  location /assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1h;
  }
  location ~ ^/protected/(.*) {
    internal;
    try_files /$1 =404;
    add_header Cache-Control "private, no-store" always;
  }
  location /socket.io {
    proxy_pass http://socketio;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Frappe-Site-Name $host;
    proxy_set_header Origin $forwarded_scheme://$host;
  }
  location / {
    proxy_pass http://frappe;
    proxy_set_header Host $host;
    proxy_set_header X-Frappe-Site-Name $host;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    add_header Cache-Control "private, no-store" always;
    add_header Permissions-Policy "microphone=(self)" always;
  }
}
